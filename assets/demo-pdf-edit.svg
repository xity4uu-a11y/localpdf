    <text x="20" y="100" fill="#1d1d1f" class="sans" font-size="11.5">Harborline Studio LLC</text>

    <text x="12" y="130" fill="#6e6e73" class="sans" font-size="10.5">Matched Font</text>
    <rect x="12" y="136" width="142" height="26" rx="5" fill="#ffffff" stroke="#e2e2e7" />
    <text x="20" y="153" fill="#1d1d1f" class="sans" font-size="11">Helvetica (Sans)</text>
    <rect x="162" y="136" width="28" height="26" rx="5" fill="#0066cc" />

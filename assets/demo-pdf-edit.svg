  <text x="16" y="72" fill="#71717a" class="sans" font-size="10.5" font-weight="600" letter-spacing="0.5">PAGES</text>
  <text x="142" y="72" fill="#71717a" class="mono" font-size="10.5">2</text>
  <line x1="0" y1="84" x2="168" y2="84" stroke="#e2e2e7" />

  <!-- Page 1 Thumbnail (Active) -->
  <rect x="14" y="96" width="140" height="128" rx="7" fill="#eff6ff" stroke="#0066cc" stroke-width="1.2" />
  <rect x="34" y="106" width="100" height="86" rx="3" fill="#ffffff" stroke="#e2e2e7" />
  <rect x="44" y="118" width="12" height="12" fill="#1d1d1f" />
  <rect x="62" y="120" width="52" height="5" rx="1" fill="#1d1d1f" />
  <rect x="44" y="142" width="80" height="6" rx="1" fill="#f0f0f4" />
  <rect x="44" y="154" width="60" height="3.5" rx="1" fill="#a1a1aa" />
  <rect x="44" y="164" width="72" height="3.5" rx="1" fill="#a1a1aa" />
  <text x="24" y="212" fill="#1d1d1f" class="mono" font-size="10.5" font-weight="600">01</text>
  <text x="108" y="212" fill="#0066cc" class="mono" font-size="9.5">2 edits</text>

  <!-- Page 2 Thumbnail -->
  <rect x="14" y="236" width="140" height="128" rx="7" fill="#f9f9fb" stroke="#e2e2e7" />
  <rect x="34" y="246" width="100" height="86" rx="3" fill="#ffffff" stroke="#e2e2e7" />
  <rect x="44" y="258" width="48" height="6" rx="1" fill="#27272a" />
  <rect x="44" y="270" width="78" height="3.5" rx="1" fill="#a1a1aa" />
  <rect x="44" y="284" width="64" height="3.5" rx="1" fill="#a1a1aa" />

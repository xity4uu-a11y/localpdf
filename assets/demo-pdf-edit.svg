<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 580" width="1080" height="580" role="img" aria-label="Animated walkthrough of localpdf editing PDF text, swapping a logo, and downloading locally with 0 bytes uploaded">
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, 'Segoe UI', sans-serif; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }

    /* 15-second seamless loop keyframes */
    @keyframes titleOldFade {
      0%, 40% { opacity: 1; }
      43%, 96% { opacity: 0; }
      100% { opacity: 1; }
    }
    @keyframes titleNewFade {
      0%, 42% { opacity: 0; }
      45%, 96% { opacity: 1; }
      100% { opacity: 0; }
    }
    @keyframes selectionBox {
      0%, 16% { opacity: 0; }
      20%, 62% { opacity: 1; }
      65%, 100% { opacity: 0; }
    }
    @keyframes logoNewFade {
      0%, 66% { opacity: 0; }
      70%, 96% { opacity: 1; }
      100% { opacity: 0; }
    }
    @keyframes logoSelection {
      0%, 64% { opacity: 0; }
      67%, 81% { opacity: 1; }
      84%, 100% { opacity: 0; }
    }
    @keyframes inspectorTextPanel {
      0%, 18% { opacity: 0; }
      21%, 63% { opacity: 1; }
      66%, 100% { opacity: 0; }
    }
    @keyframes inspectorLogoPanel {
      0%, 65% { opacity: 0; }
      68%, 95% { opacity: 1; }
      98%, 100% { opacity: 0; }
    }
    @keyframes downloadToast {
      0%, 84% { opacity: 0; transform: translateY(10px); }
      87%, 96% { opacity: 1; transform: translateY(0px); }
      100% { opacity: 0; transform: translateY(10px); }
    }
    @keyframes cursorPath {
      0%   { transform: translate(240px, 320px); }
      18%  { transform: translate(430px, 145px); }
      42%  { transform: translate(430px, 145px); }
      66%  { transform: translate(318px, 150px); }
      80%  { transform: translate(965px, 28px); }
      95%  { transform: translate(965px, 28px); }
      100% { transform: translate(240px, 320px); }
    }
    @keyframes downloadPulse {
      0%, 80% { fill: #0066cc; }
      83%, 88% { fill: #1c6b36; }
      95%, 100% { fill: #0066cc; }
    }

    .title-old { animation: titleOldFade 15s infinite; }
    .title-new { animation: titleNewFade 15s infinite; }
    .sel-box { animation: selectionBox 15s infinite; }
    .logo-new { animation: logoNewFade 15s infinite; }
    .logo-sel { animation: logoSelection 15s infinite; }
    .insp-text { animation: inspectorTextPanel 15s infinite; }
    .insp-logo { animation: inspectorLogoPanel 15s infinite; }
    .toast { animation: downloadToast 15s infinite; }
    .cursor { animation: cursorPath 15s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
    .dl-btn { animation: downloadPulse 15s infinite; }
  </style>

  <!-- Outer Frame -->
  <rect width="1080" height="580" rx="12" fill="#f5f5f7" stroke="#d4d4d8" stroke-width="1" />

  <!-- Top Toolbar -->
  <rect x="0" y="0" width="1080" height="48" rx="12" fill="#ffffff" />
  <rect x="0" y="36" width="1080" height="12" fill="#ffffff" />
  <line x1="0" y1="48" x2="1080" y2="48" stroke="#e2e2e7" stroke-width="1" />

  <!-- Brand -->
  <rect x="16" y="13" width="22" height="22" rx="5" fill="#1d1d1f" />
  <text x="21" y="28" fill="#ffffff" class="mono" font-size="9.5" font-weight="700">LP</text>
  <text x="46" y="29" fill="#1d1d1f" class="sans" font-size="13.5" font-weight="600">localpdf</text>

  <!-- Tool Segmented Bar -->
  <rect x="196" y="10" width="322" height="28" rx="7" fill="#f5f5f7" stroke="#e2e2e7" />
  <rect x="252" y="12" width="76" height="24" rx="5" fill="#ffffff" stroke="#e2e2e7" />
  <text x="208" y="28" fill="#6e6e73" class="sans" font-size="11">Select</text>
  <text x="266" y="28" fill="#1d1d1f" class="sans" font-size="11" font-weight="600">Edit Text</text>
  <text x="342" y="28" fill="#6e6e73" class="sans" font-size="11">Add Text</text>
  <text x="404" y="28" fill="#6e6e73" class="sans" font-size="11">Logo</text>
  <text x="450" y="28" fill="#6e6e73" class="sans" font-size="11">Sign</text>

  <!-- Privacy Pill -->
  <rect x="656" y="11" width="248" height="26" rx="13" fill="#eef7f1" stroke="#c5e5d0" />
  <circle cx="672" cy="24" r="3.5" fill="#1c6b36" />
  <text x="683" y="28" fill="#1c6b36" class="mono" font-size="10.5">Local Browser Engine · 0 bytes uploaded</text>

  <!-- Download PDF Button -->
  <rect x="916" y="10" width="148" height="28" rx="7" class="dl-btn" fill="#0066cc" />
  <text x="938" y="28" fill="#ffffff" class="sans" font-size="11.5" font-weight="600">Download PDF — Free</text>


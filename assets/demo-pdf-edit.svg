  <!-- Rendered PDF Page -->
  <g transform="translate(260, 74)">
    <rect x="0" y="0" width="460" height="482" rx="3" fill="#ffffff" stroke="#d4d4d8" />
    <rect x="0" y="0" width="460" height="7" fill="#1d1d1f" />

    <!-- Original Logo Box -->
    <g transform="translate(34, 42)">
      <rect x="0" y="0" width="34" height="34" fill="#1d1d1f" />
      <rect x="7" y="7" width="20" height="20" fill="none" stroke="#ffffff" stroke-width="1.8" />
      <text x="9.5" y="20.5" fill="#ffffff" class="sans" font-size="8.5" font-weight="700">NW</text>

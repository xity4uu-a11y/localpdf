      <rect x="1" y="1" width="34" height="34" rx="4" fill="#1e40af" stroke="#18181b" stroke-width="1.5" />
      <rect x="9" y="9" width="5" height="18" fill="#ffffff" />
      <rect x="9" y="22" width="18" height="5" fill="#ffffff" />
      <rect x="18" y="9" width="9" height="5" fill="#ffffff" />
    </g>
    <rect class="logo-sel" x="32" y="40" width="38" height="38" fill="none" stroke="#0066cc" stroke-width="1.5" />

    <!-- Detected Text Tag + Highlight -->
    <g class="sel-box">
      <rect x="76" y="25" width="128" height="17" rx="4" fill="#18181b" />
      <text x="83" y="37" fill="#f4f4f6" class="mono" font-size="9.5">Helvetica Bold · 18pt</text>
      <rect x="76" y="44" width="212" height="24" rx="2" fill="#eff6ff" stroke="#0066cc" stroke-width="1.2" stroke-dasharray="3 2" />
    </g>

    <!-- Original Title -->
    <text x="80" y="62" fill="#1d1d1f" class="sans title-old" font-size="18" font-weight="700">Northwind Design Co.</text>
    <!-- Edited Replacement Title (same font) -->
    <text x="80" y="62" fill="#1d1d1f" class="sans title-new" font-size="18" font-weight="700">Harborline Studio LLC</text>

    <text x="80" y="77" fill="#636366" class="sans" font-size="9">420 Harbor Ave, Suite 300  |  billing@northwind.example</text>


    <line x1="34" y1="98" x2="426" y2="98" stroke="#e4e4e7" />

    <!-- Bill To -->
    <text x="34" y="120" fill="#71717a" class="sans" font-size="8" font-weight="700">BILL TO</text>
    <text x="34" y="136" fill="#1d1d1f" class="sans" font-size="11.5" font-weight="700">Linden Labs Publishing</text>
    <text x="34" y="150" fill="#4c4c52" class="sans" font-size="9.5">Attn: Samira Patel, Operations Lead</text>

    <!-- Table Header -->
    <rect x="34" y="176" width="392" height="22" fill="#f4f4f6" />
    <text x="44" y="190" fill="#52525b" class="sans" font-size="8" font-weight="700">DESCRIPTION</text>
    <text x="372" y="190" fill="#52525b" class="sans" font-size="8" font-weight="700">AMOUNT</text>

    <text x="44" y="218" fill="#1d1d1f" class="sans" font-size="9.5">Product Design System Audit &amp; Component Spec</text>
    <text x="366" y="218" fill="#1d1d1f" class="mono" font-size="9.5" font-weight="700">$1,680.00</text>
    <line x1="34" y1="230" x2="426" y2="230" stroke="#ededf0" />

    <text x="44" y="250" fill="#1d1d1f" class="sans" font-size="9.5">Marketing Brochure &amp; Typography Refresh</text>
    <text x="366" y="250" fill="#1d1d1f" class="mono" font-size="9.5" font-weight="700">$1,000.00</text>
    <line x1="34" y1="262" x2="426" y2="262" stroke="#ededf0" />

    <text x="44" y="282" fill="#1d1d1f" class="sans" font-size="9.5">Print-Ready Export &amp; Accessibility Check</text>
    <text x="372" y="282" fill="#1d1d1f" class="mono" font-size="9.5" font-weight="700">$480.00</text>
    <line x1="34" y1="294" x2="426" y2="294" stroke="#ededf0" />

    <text x="304" y="330" fill="#1d1d1f" class="sans" font-size="11" font-weight="700">Total Due</text>
    <text x="362" y="330" fill="#1d1d1f" class="mono" font-size="11" font-weight="700">$3,160.00</text>

    <!-- Signature Line -->
    <path d="M 38 424 Q 58 404 72 420 T 110 416 T 144 422" fill="none" stroke="#1e3a8a" stroke-width="2" stroke-linecap="round" />
    <line x1="34" y1="432" x2="184" y2="432" stroke="#a1a1aa" />
    <text x="34" y="446" fill="#71717a" class="sans" font-size="8.5">Authorized Signature</text>
  </g>

  <!-- Right Inspector Panel -->
  <rect x="812" y="48" width="268" height="532" fill="#ffffff" />
  <line x1="812" y1="48" x2="812" y2="580" stroke="#e2e2e7" stroke-width="1" />
  <text x="846" y="71" fill="#1d1d1f" class="sans" font-size="11.5" font-weight="600">Inspector</text>
  <line x1="812" y1="84" x2="946" y2="84" stroke="#0066cc" stroke-width="2" />
  <text x="980" y="71" fill="#71717a" class="sans" font-size="11.5">Presets (5)</text>
  <line x1="812" y1="84" x2="1080" y2="84" stroke="#e2e2e7" />

  <!-- Inspector: Matched Text Card -->

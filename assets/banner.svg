<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="localpdf banner — Client-side browser PDF editor">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e2028" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="1200" height="340" fill="#0f1115" rx="12" />
  <rect width="1200" height="340" fill="url(#grid)" rx="12" />
  <rect x="0.5" y="0.5" width="1199" height="339" fill="none" stroke="#262933" stroke-width="1" rx="12" />

  <!-- Minimalist Document Icon Mark -->
  <g transform="translate(76, 84)">
    <rect x="0" y="0" width="52" height="52" rx="12" fill="#f4f4f6" />
    <rect x="13" y="12" width="20" height="28" rx="2" fill="none" stroke="#0f1115" stroke-width="2.2" />
    <path d="M 27 12 L 33 18 L 27 18 Z" fill="#0f1115" />
    <line x1="17" y1="24" x2="29" y2="24" stroke="#0f1115" stroke-width="2" />
    <line x1="17" y1="30" x2="26" y2="30" stroke="#0f1115" stroke-width="2" />
    <rect x="33" y="28" width="10" height="10" rx="2" fill="#2563eb" />
  </g>

  <!-- Title & Subtitle -->
  <text x="148" y="114" fill="#f4f4f6" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Inter, 'Segoe UI', sans-serif" font-size="40" font-weight="600" letter-spacing="-1.2">localpdf</text>
  <text x="148" y="148" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, 'Segoe UI', sans-serif" font-size="18" font-weight="400">
    Edit PDF text, swap logos, sign, and merge pages right in your browser.
  </text>

  <!-- Feature Pills -->
  <g transform="translate(148, 192)" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5">
    <rect x="0" y="0" width="166" height="32" rx="6" fill="#171920" stroke="#2a2d38" />
    <circle cx="16" cy="16" r="3.5" fill="#4cc38a" />
    <text x="28" y="20" fill="#d4d4d8">0 bytes uploaded</text>

    <rect x="180" y="0" width="184" height="32" rx="6" fill="#171920" stroke="#2a2d38" />
    <text x="196" y="20" fill="#d4d4d8">Auto font matching</text>

    <rect x="378" y="0" width="142" height="32" rx="6" fill="#171920" stroke="#2a2d38" />
    <text x="394" y="20" fill="#d4d4d8">No watermark</text>

    <rect x="534" y="0" width="136" height="32" rx="6" fill="#171920" stroke="#2a2d38" />
    <text x="550" y="20" fill="#d4d4d8">No paywall</text>
  </g>

  <!-- Right-side minimalist page architecture preview -->
  <g transform="translate(888, 56)">
    <rect x="0" y="0" width="236" height="228" rx="8" fill="#16181f" stroke="#2a2d38" stroke-width="1" />
    <rect x="16" y="18" width="204" height="192" rx="4" fill="#ffffff" />
    <!-- Mini logo block -->
    <rect x="30" y="34" width="24" height="24" rx="3" fill="#1e40af" />
    <rect x="36" y="40" width="12" height="12" fill="none" stroke="#ffffff" stroke-width="1.8" />
    <!-- Highlighted matched text line -->
    <rect x="64" y="34" width="134" height="18" rx="2" fill="#eff6ff" stroke="#2563eb" stroke-width="1" stroke-dasharray="3 2" />
    <rect x="68" y="40" width="96" height="6" rx="1.5" fill="#18181b" />
    <rect x="64" y="57" width="84" height="4" rx="1" fill="#a1a1aa" />
    <!-- Font tag -->
    <rect x="64" y="18" width="112" height="14" rx="3" fill="#18181b" />
    <text x="70" y="28" fill="#f4f4f6" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="8.5">Helvetica Bold 18pt</text>
    <!-- Mini invoice rows -->
    <rect x="30" y="80" width="176" height="14" rx="2" fill="#f4f4f5" />
    <rect x="30" y="104" width="118" height="5" rx="1.5" fill="#52525b" />
    <rect x="166" y="104" width="40" height="5" rx="1.5" fill="#18181b" />
    <line x1="30" y1="118" x2="206" y2="118" stroke="#e4e4e7" stroke-width="1" />
    <rect x="30" y="128" width="96" height="5" rx="1.5" fill="#52525b" />
    <rect x="166" y="128" width="40" height="5" rx="1.5" fill="#18181b" />
    <line x1="30" y1="142" x2="206" y2="142" stroke="#e4e4e7" stroke-width="1" />
    <!-- Mini signature curve -->
    <path d="M 32 184 Q 48 168 58 182 T 86 178 T 112 183" fill="none" stroke="#1e3a8a" stroke-width="2" stroke-linecap="round" />
    <line x1="30" y1="190" x2="122" y2="190" stroke="#a1a1aa" stroke-width="1" />
  </g>

  <text x="148" y="286" fill="#71717a" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12">
    React 19 + TypeScript + PDF.js + pdf-lib  ·  MIT License  ·  github.com/xity4uu-a11y/localpdf
  </text>
</svg>
